name: Replicate NY Fed ACM

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      make_release:
        description: "Create or update this month's release from main"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  reproduce-official-acm:
    name: reproduce-official-acm
    runs-on: ubuntu-latest
    env:
      RELEASE_ASSETS_DIR: outputs/release_assets
      SHOULD_RELEASE: ${{ github.event_name == 'schedule' || github.event.inputs.make_release == 'true' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event.inputs.make_release == 'true') && 'main' || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Replicate NY Fed ACM
        run: make verify

      - name: Upload CI artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: ACMTermPremium_replicated
          path: |
            outputs/ACMTermPremium_replicated.xlsx
            outputs/ACMTermPremium_replicated_monthly_1m_120m.csv.gz
            outputs/ACMTermPremium_replicated_daily_1m_120m.csv.gz
            outputs/ACMTermPremium_replicated/run_metadata.csv
            outputs/ACMTermPremium_replicated/monthly_comparison_by_family.csv
            outputs/ACMTermPremium_replicated/daily_comparison_by_family.csv
          if-no-files-found: error

      - name: Build release metadata
        if: env.SHOULD_RELEASE == 'true'
        id: release_meta
        run: |
          python - <<'PY'
          import csv
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          diagnostics = Path("outputs/ACMTermPremium_replicated")

          metadata = {}
          with (diagnostics / "run_metadata.csv").open(newline="") as handle:
              for row in csv.DictReader(handle):
                  metadata[row["setting"]] = row["value"]

          def max_diff(path):
              with path.open(newline="") as handle:
                  rows = list(csv.DictReader(handle))
              return max(float(row["max_abs_diff_bp"]) for row in rows)

          monthly_max = max_diff(diagnostics / "monthly_comparison_summary.csv")
          daily_max = max_diff(diagnostics / "daily_comparison_summary.csv")

          release_month = datetime.now(timezone.utc).strftime("%Y-%m")
          title = f"ACM Term Premium {release_month}"
          tag = f"acm-term-premium-{release_month}"
          commit = subprocess.run(
              ["git", "rev-parse", "HEAD"], check=True, capture_output=True, text=True
          ).stdout.strip()

          gsw_url = metadata.get("gsw_url", "")
          fedfunds_url = metadata.get("fedfunds_url", "")
          gsw_first = metadata.get("gsw_daily_first", "")
          gsw_last = metadata.get("gsw_daily_last", "")
          official_input = Path(metadata["official_workbook_cache"]).name
          gsw_input = Path(metadata["gsw_cache"]).name
          fedfunds_input = Path(metadata["fedfunds_cache"]).name
          workbook_output = Path(metadata["output_workbook"]).name
          monthly_gz_output = Path(metadata["expanded_monthly_output_csv_gz"]).name
          daily_gz_output = Path(metadata["expanded_daily_output_csv_gz"]).name

          notes = f"""# {title}

          Generated by GitHub Actions after replicating the NY Fed ACM workbook.

          - Target branch: main
          - Target commit: {commit}
          - Monthly range: {metadata['generated_monthly_first']} to {metadata['generated_monthly_last']} ({metadata['generated_monthly_rows']} rows)
          - Daily range: {metadata['generated_daily_first']} to {metadata['generated_daily_last']} ({metadata['generated_daily_rows']} rows)
          - Monthly max absolute difference: {monthly_max:.12g} bp
          - Daily max absolute difference: {daily_max:.12g} bp

          ## Input provenance

          - GSW yield-curve data: {gsw_url}
          - Federal funds rate data: {fedfunds_url}
          - GSW date range used: {gsw_first} to {gsw_last}

          ## Release assets

          - `{workbook_output}` — NY Fed-format workbook (ACM Monthly + ACM Daily)
          - `{monthly_gz_output}` — expanded monthly CSV (1 m–120 m maturities)
          - `{daily_gz_output}` — expanded daily CSV (1 m–120 m maturities)
          - `{official_input}` — raw NY Fed ACM workbook download used for validation
          - `{gsw_input}` — raw GSW yield-curve parameter download
          - `{fedfunds_input}` — raw federal funds rate download used for short-rate preprocessing

          ## Data license and attribution

          The series in these assets are *replicated* by this project's code --
          modified/derived content whose modifications must not be attributed to
          the Federal Reserve Bank of New York. ACM term premium content: (c)
          Federal Reserve Bank of New York, subject to the Terms of Use at
          newyorkfed.org; redistribution carries those same terms. GSW
          yield-curve and H.15 input data are produced by the Board of Governors
          of the Federal Reserve System (public domain; cite the Board). This
          project is not affiliated with or endorsed by either institution.
          """
          Path("release_notes.md").write_text(notes)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as handle:
              handle.write(f"tag={tag}\n")
              handle.write(f"title={title}\n")
              handle.write(f"target={commit}\n")
          PY

      - name: Stage release assets
        if: env.SHOULD_RELEASE == 'true'
        run: |
          python - <<'PY'
          import csv
          import os
          import shutil
          from pathlib import Path

          diagnostics = Path("outputs/ACMTermPremium_replicated")
          release_dir = Path(os.environ["RELEASE_ASSETS_DIR"])
          if release_dir.exists():
              shutil.rmtree(release_dir)
          release_dir.mkdir(parents=True)

          metadata = {}
          with (diagnostics / "run_metadata.csv").open(newline="") as handle:
              for row in csv.DictReader(handle):
                  metadata[row["setting"]] = row["value"]

          sources = [
              metadata["output_workbook"],
              metadata["expanded_monthly_output_csv_gz"],
              metadata["expanded_daily_output_csv_gz"],
              metadata["official_workbook_cache"],
              metadata["gsw_cache"],
              metadata["fedfunds_cache"],
          ]

          staged = []
          for source in sources:
              source_path = Path(source)
              if not source_path.is_file():
                  raise FileNotFoundError(f"Release asset source does not exist: {source_path}")
              target_path = release_dir / source_path.name
              if target_path.name in staged:
                  raise ValueError(f"Duplicate release asset filename: {target_path.name}")
              shutil.copy2(source_path, target_path)
              staged.append(target_path.name)

          print("Staged release assets:")
          for name in sorted(staged):
              print(f"- {name}")
          PY

      - name: Create or update monthly release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          TITLE: ${{ steps.release_meta.outputs.title }}
          TARGET: ${{ steps.release_meta.outputs.target }}
        run: |
          mapfile -t EXPECTED_ASSETS < <(
            find "$RELEASE_ASSETS_DIR" -maxdepth 1 -type f -exec basename {} \; | sort
          )

          if [ "${#EXPECTED_ASSETS[@]}" -eq 0 ]; then
            echo "No staged release assets found in $RELEASE_ASSETS_DIR" >&2
            exit 1
          fi

          release_has_asset() {
            local candidate="$1"
            local expected
            for expected in "${EXPECTED_ASSETS[@]}"; do
              if [ "$candidate" = "$expected" ]; then
                return 0
              fi
            done
            return 1
          }

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              if [ -n "$asset" ] && ! release_has_asset "$asset"; then
                gh release delete-asset "$TAG" "$asset" \
                  --repo "$GITHUB_REPOSITORY" \
                  --yes
              fi
            done < <(
              gh release view "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name'
            )

            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TITLE" \
              --notes-file release_notes.md
            gh release upload "$TAG" \
              "$RELEASE_ASSETS_DIR"/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              "$RELEASE_ASSETS_DIR"/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TITLE" \
              --notes-file release_notes.md
          fi
