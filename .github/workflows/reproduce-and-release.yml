name: Reproduce official ACM

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      make_release:
        description: "Create or update this month's release from main"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  reproduce-official-acm:
    name: reproduce-official-acm
    runs-on: ubuntu-latest
    env:
      OFFICIAL_ACM_URL: https://www.newyorkfed.org/medialibrary/media/research/data_indicators/ACMTermPremium.xls
      OUTPUT_WORKBOOK: outputs/ACMTermPremium_reproduced.xlsx
      OUTPUT_CSV_GZ: outputs/ACMTermPremium_reproduced_monthly_6m_120m.csv.gz
      SHOULD_RELEASE: ${{ github.event_name == 'schedule' || github.event.inputs.make_release == 'true' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event.inputs.make_release == 'true') && 'main' || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Reproduce official ACM
        run: |
          python reproduce_acm.py \
            --official "$OFFICIAL_ACM_URL" \
            --output "$OUTPUT_WORKBOOK" \
            --assert-official-reproduced \
            --max-abs-diff-bp 0.01

      - name: Upload expanded monthly CSV gzip
        uses: actions/upload-artifact@v7
        with:
          name: ACMTermPremium_reproduced_monthly_6m_120m
          path: ${{ env.OUTPUT_CSV_GZ }}
          if-no-files-found: error

      - name: Build release metadata
        if: env.SHOULD_RELEASE == 'true'
        id: release_meta
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          diagnostics = Path("outputs/ACMTermPremium_reproduced")

          metadata = {}
          with (diagnostics / "run_metadata.csv").open(newline="") as handle:
              for row in csv.DictReader(handle):
                  metadata[row["setting"]] = row["value"]

          def max_diff(path):
              with path.open(newline="") as handle:
                  rows = list(csv.DictReader(handle))
              return max(float(row["max_abs_diff_bp"]) for row in rows)

          monthly_max = max_diff(diagnostics / "monthly_comparison_summary.csv")
          daily_max = max_diff(diagnostics / "daily_comparison_summary.csv")

          release_month = os.popen("date -u +%Y-%m").read().strip()
          title = f"ACM Term Premium {release_month}"
          tag = f"acm-term-premium-{release_month}"
          commit = os.popen("git rev-parse HEAD").read().strip()

          notes = f"""# {title}

          Generated by GitHub Actions after reproducing the official NY Fed ACM workbook.

          - Target branch: main
          - Target commit: {commit}
          - Monthly range: {metadata['generated_monthly_first']} to {metadata['generated_monthly_last']} ({metadata['generated_monthly_rows']} rows)
          - Daily range: {metadata['generated_daily_first']} to {metadata['generated_daily_last']} ({metadata['generated_daily_rows']} rows)
          - Monthly max absolute difference: {monthly_max:.12g} bp
          - Daily max absolute difference: {daily_max:.12g} bp
          - Asset: ACMTermPremium_reproduced_monthly_6m_120m.csv.gz
          """
          Path("release_notes.md").write_text(notes)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as handle:
              handle.write(f"tag={tag}\n")
              handle.write(f"title={title}\n")
              handle.write(f"target={commit}\n")
          PY

      - name: Create or update monthly release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          TITLE: ${{ steps.release_meta.outputs.title }}
          TARGET: ${{ steps.release_meta.outputs.target }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TITLE" \
              --notes-file release_notes.md
            gh release upload "$TAG" "$OUTPUT_CSV_GZ" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" "$OUTPUT_CSV_GZ" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TITLE" \
              --notes-file release_notes.md
          fi
